name: My Workflow
on:
  workflow_dispatch:
    inputs:
      resumeUrl:
        description: 'Webhook URL to notify n8n'
      message:
        description: 'Optional message'
        required: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Run Task
        run: echo "Running workflow with message: ${{ inputs.message }}"
      - name: Notify n8n on Completion
        run: |
          curl -X POST ${{ inputs.resumeUrl }} \
          -H "Content-Type: application/json" \
          -d '{"workflow_id": "${{ github.run_id }}", "status": "${{ job.status }}"}'
